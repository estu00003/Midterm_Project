<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="css/style.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <title>The System</title>
    
</head>
<body>
    <header role="banner">
        <h1>THE <span class="highlight">SYSTEM</span></h1>
        <nav role="navigation">
            <ul>
                <li><a href="" class="planet-link">Planets</a></li>
                <li><a href="" class="planet-link">Interstellar</a></li>
                <li><a href="" class="planet-link contact-button">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="hero">
            <img src="images/milky-way.jpg" alt="Header Banner" class="hero-image">
            <div class="hero-text">
                <p>THE SYSTEM MAGAZINE</p>
                <h1>Welcome to the <span class="highlight">Solar System</span></h1>
                <p>Take a tour around the coolest stellar system around.</p>
            </div>
        </section>

        <section class="locals">
            <h2>Meet the Locals</h2>
            <div class="planet-grid">
                <div class="planet">
                    <img src="images/sun.jpg" alt="The Sun">
                    <h3>The Sun</h3>
                    <button>Learn More</button>
                </div>
                <div class="planet">
                    <img src="images/mercury.jpg" alt="Mercury">
                    <h3>Mercury</h3>
                    <button>Learn More</button>
                </div>
                <div class="planet">
                    <img src="images/venus.jpg" alt="Venus">
                    <h3>Venus</h3>
                    <button>Learn More</button>
                </div>
                <div class="planet">
                    <img src="images/earth.jpg" alt="Earth">
                    <h3>Earth</h3>
                    <button>Learn More</button>
                </div>
                <div class="planet">
                    <img src="images/moon.jpg" alt="The Moon">
                    <h3>The Moon</h3>
                    <button>Learn More</button>
                </div>
                <div class="planet">
                    <img src="images/mars.jpg" alt="Mars">
                    <h3>Mars</h3>
                    <button>Learn More</button>
                </div>
            </div>
        </section>
    </main>

    <footer role="contentinfo">
        <p>© 2024 - The System</p>
    </footer>
</body>
</html>
